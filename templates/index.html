<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lucky Win</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="container">

        <!-- Brand -->
        <div class="brand">
            <h1>Lucky <span>Win</span> ✨</h1>
            <p>Scan. Enter. Win.</p>
        </div>

        <!-- Hero -->
        <section class="hero">

            <div class="hero-icon">
                🎁
            </div>

            <h2>Your chance to win!</h2>

            <p>
                Enter your details below for a chance to become
                one of our lucky winners.
            </p>

        </section>

        <!-- Registration Card -->
        <section class="card">

            <form method="POST" action="/register">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="phone">Mobile Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your mobile number"
                        maxlength="10"
                        minlength="10"
                        pattern="[0-9]{10}"
                        pattern="[0-9]{10}"
                        title="Please enter a valid phone."  
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                        required
                    >
                </div>


                <button type="submit" class="btn">
                    🎉 ENTER NOW
                </button>

            </form>

            <p class="note">
                Your unique entry code will be generated after registration.
            </p>

        </section>

    </main>

</body>

</html>
